<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification Success</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 400px;
        }
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 100px;
            height: 100px;
            margin-right: 20px;
        }
        .success-icon {
            width: 50px;
            height: 50px;
            filter: hue-rotate(120deg); /* Adds a green color effect */
        }
        .success-message {
            font-size: 20px;
            color: #28a745;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .message {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }
        .website-link {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .website-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="https://lkfqvubqjqfembxedxkv.supabase.co/storage/v1/object/public/random//logo.jpg" alt="GitHub Logo">
            <img class="success-icon" src="https://img.icons8.com/ios/452/checked.png" alt="Success Icon">
        </div>
        <div class="success-message">
            Email Verification Successful!
        </div>
        <div class="message">
            Your email has been verified successfully. Please go back to the app and click the "Done" button to continue enjoying your experience.
        </div>
        <a href="https://abdorll.github.io" class="website-link">Check my website</a>
    </div>

</body>
</html>
